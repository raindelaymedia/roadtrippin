name: Daily data refresh

on:
  schedule:
    # 09:00 UTC daily = ~05:00 EDT / 04:00 EST — dashboards update overnight
    - cron: '0 9 * * *'
  workflow_dispatch:   # manual "Run workflow" button in Actions tab

permissions:
  contents: write      # needed so the bot can commit refreshed data back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # need full history so the auto-commit pushes cleanly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2 \
            requests \
            openpyxl \
            python-dateutil

      # ── Socials: platform APIs → each show's socials CSV ───
      # Runs before every dashboard build so they pick up today's numbers.
      # Add a show's token here (and its key to --show) as each account connects.
      - name: Sync socials from platform APIs
        continue-on-error: true
        env:
          IG_TOKEN_GT: ${{ secrets.IG_TOKEN_GT }}
          IG_TOKEN_SR: ${{ secrets.IG_TOKEN_SR }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_TOKEN_SR: ${{ secrets.TT_TOKEN_SR }}
          TT_TOKEN_RT: ${{ secrets.TT_TOKEN_RT }}
          TOKEN_OUT_DIR: ${{ runner.temp }}/tokens
        run: python master/sync_socials.py --show gt sr rt

      # Instagram tokens expire after 60 days unless refreshed. The sync refreshes
      # them; this saves the refreshed ones back to the repo's secrets. Same for a
      # TikTok refresh token if TikTok ever hands back a new one.
      - name: Save refreshed API tokens to secrets
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          for f in "$RUNNER_TEMP"/tokens/*; do
            [ -f "$f" ] || continue
            gh secret set "$(basename "$f")" < "$f"
            echo "✓ refreshed $(basename "$f")"
          done

      # ── Road Trippin' ──────────────────────────────────────
      - name: Write RT config.py from secret
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}
        run: |
          printf "%s" "$CONFIG_PY" > master/shows/road_trippin/config.py
          test -s master/shows/road_trippin/config.py || { echo "config.py is empty — check the CONFIG_PY secret"; exit 1; }
          echo "✓ RT config.py written ($(wc -c < master/shows/road_trippin/config.py) bytes)"

      - name: Run RT tracker (pulls YT + Megaphone API data)
        working-directory: master/shows/road_trippin
        run: python build_tracker.py

      - name: Rebuild Road Trippin' dashboard
        working-directory: master/shows/road_trippin
        run: python build_rt_dashboard.py

      # ── Girls Tripp ────────────────────────────────────────
      # continue-on-error: a GT hiccup shouldn't block the RT/SR refresh + commit
      - name: Write GT config_gt.py from secret
        env:
          CONFIG_GT_PY: ${{ secrets.CONFIG_GT_PY }}
        run: |
          printf "%s" "$CONFIG_GT_PY" > master/shows/road_trippin/config_gt.py
          test -s master/shows/road_trippin/config_gt.py || { echo "config_gt.py is empty — check the CONFIG_GT_PY secret"; exit 1; }
          echo "✓ GT config_gt.py written ($(wc -c < master/shows/road_trippin/config_gt.py) bytes)"

      - name: Run GT tracker (pulls YT API data + RT attribution)
        id: gt_tracker
        continue-on-error: true
        working-directory: master/shows/road_trippin
        run: python build_gt_tracker.py

      - name: Rebuild Girls Tripp dashboard
        continue-on-error: true
        working-directory: master/shows/road_trippin
        run: python build_gt_dashboard.py

      # ── Football Related ───────────────────────────────────
      # continue-on-error: a new show shouldn't block the RT/SR refresh + commit
      - name: Write FR config_fr.py from secret
        id: fr_config
        continue-on-error: true
        env:
          CONFIG_FR_PY: ${{ secrets.CONFIG_FR_PY }}
        run: |
          printf "%s" "$CONFIG_FR_PY" > master/shows/road_trippin/data/football_related/config_fr.py
          test -s master/shows/road_trippin/data/football_related/config_fr.py || { echo "config_fr.py is empty — check the CONFIG_FR_PY secret"; exit 1; }
          echo "✓ FR config_fr.py written ($(wc -c < master/shows/road_trippin/data/football_related/config_fr.py) bytes)"

      - name: Run FR tracker (pulls YT API data + RT attribution)
        if: steps.fr_config.outcome == 'success'
        continue-on-error: true
        working-directory: master/shows/road_trippin/data/football_related
        run: python build_fr_tracker.py

      - name: Rebuild Football Related dashboard
        continue-on-error: true
        working-directory: master/shows/road_trippin/data/football_related
        run: python build_fr_dashboard.py

      # ── The Schultz Report ─────────────────────────────────
      - name: Write SR config_sr.py from secret
        env:
          CONFIG_SR_PY: ${{ secrets.CONFIG_SR_PY }}
        run: |
          printf "%s" "$CONFIG_SR_PY" > master/shows/schultz_report/config_sr.py
          test -s master/shows/schultz_report/config_sr.py || { echo "config_sr.py is empty — check the CONFIG_SR_PY secret"; exit 1; }
          echo "✓ SR config_sr.py written ($(wc -c < master/shows/schultz_report/config_sr.py) bytes)"

      - name: Run SR tracker (pulls YT API data)
        working-directory: master/shows/schultz_report
        run: python build_tracker_sr.py

      - name: Check out the shared Schultz repo
        id: shared_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: raindelaymedia/The-Schultz-Report
          token: ${{ secrets.SHARED_REPO_PAT }}
          path: _shared

      # Manual SR numbers (X, engaged views, Jordan's X) are entered on the shared dashboard
      - name: Pull Schultz-side manual inputs from the shared repo
        if: steps.shared_checkout.outcome == 'success'
        continue-on-error: true
        run: python master/shows/schultz_report/pull_shared_inputs_sr.py

      - name: Rebuild Schultz Report dashboard
        working-directory: master/shows/schultz_report
        run: python build_sr_dashboard.py

      # ── SR → shared Schultz repo ───────────────────────────
      # Every SR key lives here; the shared repo (raindelaymedia/The-Schultz-Report) has none.
      # This pulls Sprout (Jordan's sponsor-tagged posts) and pushes the SR data files there
      # (the shared repo was checked out to _shared/ before the SR dashboard build).
      - name: Pull SR growth windows (Instagram, two-week windows since Aug 18)
        continue-on-error: true
        env:
          IG_TOKEN_SR: ${{ secrets.IG_TOKEN_SR }}
        run: python master/shows/schultz_report/pull_growth_sr.py

      - name: Pull SR content performance (KPI framework + weekly content grades)
        continue-on-error: true
        run: python master/shows/schultz_report/pull_content_sr.py

      - name: Pull Sprout (sponsor-tagged posts)
        continue-on-error: true
        env:
          SPROUT_TOKEN: ${{ secrets.SPROUT_TOKEN }}
        run: python master/shows/schultz_report/pull_sprout_sr.py

      - name: Push SR data to the shared Schultz repo
        if: steps.shared_checkout.outcome == 'success'
        continue-on-error: true
        run: |
          S=master/shows/schultz_report/data_sr
          D=_shared/schultz_report/data_sr/from_rdm
          mkdir -p "$D/reports"
          # copy whatever exists — a missing file must not block the rest
          for f in "$S/tracker_data_sr.json" "$S/socials_sr.csv" "$S/growth_sr.json" "$S/content_sr.json" "$S"/fanatics_*.csv; do [ -f "$f" ] && cp "$f" "$D/"; done
          [ -d "$S/sprout" ] && cp -r "$S/sprout" "$D/"
          [ -d "$S/tiktok" ] && cp -r "$S/tiktok" "$D/"
          # final Fanatics reports only, once committed here (drafts stay local)
          [ -d "$S/reports/fanatics" ] && cp -r "$S/reports/fanatics" "$D/reports/" || true
          cd _shared
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schultz_report/data_sr/from_rdm
          if git diff --staged --quiet; then echo "Shared repo already up to date"
          else git commit -m "RDM daily SR data (from raindelaymedia/roadtrippin)" && git push && echo "✓ pushed to The-Schultz-Report"; fi

      - name: Remove the shared checkout
        if: always()
        run: rm -rf _shared

      # ── Competitive landscape (internal) ───────────────────
      # Public YouTube stats for competitor channels, own Cloud project + key.
      # The API only returns today's totals, so a skipped day is a gap in history.
      - name: Snapshot competitor channels
        continue-on-error: true
        env:
          YT_API_KEY_COMPETITORS: ${{ secrets.YT_API_KEY_COMPETITORS }}
        run: python master/competitors/collect_competitors.py

      - name: Rebuild competitive landscape page
        continue-on-error: true
        run: python master/competitors/build_competitors.py

      # ── Master ─────────────────────────────────────────────
      - name: Rebuild RDM master dashboard
        working-directory: master
        # output to repo root since that's where Pages serves index.html from
        run: python build_master.py --output ../index.html

      - name: Commit refreshed data + HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # never commit the secret configs back to the repo
          rm -f master/shows/road_trippin/config.py
          rm -f master/shows/schultz_report/config_sr.py
          rm -f master/shows/road_trippin/config_gt.py
          rm -f master/shows/road_trippin/data/football_related/config_fr.py
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit — data hasn't moved since last refresh."
          else
            git commit -m "chore: daily data refresh [skip ci]"
            git push
            echo "✓ Pushed refreshed dashboards"
          fi