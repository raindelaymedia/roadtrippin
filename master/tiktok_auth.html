<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok connection — Rain Delay Media</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#F6F7F9; --surface:#fff; --border:#E2E5EA; --ink:#0F172A; --text2:#475569; --mut:#94A3B8; --brand:#1E3A5F; }
  body { margin:0; font-family:-apple-system,system-ui,'Inter',sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:560px; margin:60px auto; padding:0 20px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { font-size:20px; margin:0 0 6px; } p { color:var(--text2); line-height:1.55; font-size:14px; }
  .code { font-family:ui-monospace,Menlo,monospace; font-size:13px; background:#F1F3F6; border:1px solid var(--border);
          border-radius:8px; padding:12px; word-break:break-all; margin:14px 0; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  .ok { color:#15803D; font-weight:600; } .err { color:#B91C1C; font-weight:600; }
  small { color:var(--mut); }
</style></head><body><div class="wrap"><div class="card" id="box">
  <h1>TikTok connection</h1>
  <p>Waiting for TikTok…</p>
</div></div>
<script>
// Landing page for the Rain Delay Media TikTok app (Login Kit redirect URI).
// Shows the one-time authorization code so it can be exchanged for a token by
// master/tiktok_auth.py. The code expires within minutes and is useless without
// the app's client secret, which never touches this page.
const q = new URLSearchParams(location.search);
const box = document.getElementById('box');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (q.get('error')) {
  box.innerHTML = `<h1>TikTok connection</h1><p class="err">Not connected: ${esc(q.get('error_description') || q.get('error'))}</p>
    <p>Nothing was shared. You can close this tab and try the link again.</p>`;
} else if (q.get('code')) {
  const code = q.get('code');
  box.innerHTML = `<h1>TikTok connection</h1>
    <p class="ok">✓ Authorized${q.get('state') ? ' · ' + esc(q.get('state')) : ''}</p>
    <p>Send this code to Andrew right away — it expires in a few minutes:</p>
    <div class="code" id="c">${esc(code)}</div>
    <button id="copy">Copy code</button> <small id="msg"></small>
    <p><small>This only lets Rain Delay Media read view counts and follower stats for this account. It can't post or change anything.</small></p>`;
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(code); document.getElementById('msg').textContent = 'Copied'; }
    catch { document.getElementById('msg').textContent = 'Select the code above and copy it'; }
  };
} else {
  box.innerHTML = `<h1>TikTok connection</h1><p>This page finishes connecting a TikTok account to Rain Delay Media's analytics. Open it from the authorization link you were sent.</p>`;
}
</script>
</body></html>
